[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arm_kin"
version = "0.1.0"
description = "EC616 forward/inverse kinematics (embedded in embody_model_eval)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20,<1.25",
    "scipy>=1.9,<1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
