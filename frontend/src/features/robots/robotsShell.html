<header>
  <div>
    <h1 data-i18n="robots.title">机械臂 3D</h1>
    <p class="header-blurb" data-i18n="robots.subtitle">从 robots.json 选择机型，浏览 URDF 与关节</p>
  </div>
  <div class="toolbar">
    <label for="robotSelect" data-i18n="robots.modelLabel">机型</label>
    <select id="robotSelect" class="robot-select" data-i18n-aria="robots.selectAria" aria-label="选择机械臂型号"></select>
    <span class="pill" id="robotCount">—</span>
  </div>
</header>

<div class="layout">
  <aside class="side" data-i18n-aria="robots.infoAria" aria-label="机型信息">
    <h2 id="robotTitle">—</h2>
    <p class="desc" id="robotDesc" data-i18n="robots.loadingRegistry">加载 robots.json…</p>
    <div class="meta-grid" id="metaGrid"></div>
    <h2 style="margin-top:4px" data-i18n="robots.joints">关节</h2>
    <div class="joint-list" id="jointList"></div>
    <div class="btn-row">
      <button type="button" id="btnHome" data-i18n="robots.btnHome">回 home</button>
      <button type="button" id="btnZero" data-i18n="robots.btnZero">回零</button>
      <button type="button" id="btnFit" data-i18n="robots.btnFit">适配相机</button>
    </div>
    <p id="statusErr" hidden></p>
  </aside>
    <div id="viewer" data-i18n-aria="robots.viewerAria" aria-label="3D 视图">
    <div class="emb-load loading" id="loading">
      <div class="emb-load-card loading-card">
        <div class="emb-load-spinner" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="emb-load-text loading-text" id="loadText" data-i18n="robots.preparing">准备加载…</div>
        <div class="emb-load-bar loading-bar" aria-hidden="true">
          <div class="emb-load-bar-fill loading-bar-fill" id="loadBar"></div>
        </div>
        <div class="emb-load-meta loading-meta" id="loadMeta"></div>
      </div>
    </div>
  </div>
</div>
